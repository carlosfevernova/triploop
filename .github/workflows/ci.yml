name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: Type + Lint + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Coverage
        run: npm run coverage -- --reporter=text --reporter=lcov
        continue-on-error: true  # No hard threshold yet — see vitest.config.ts

      - name: Lint
        run: npm run lint
        continue-on-error: true  # Existing warnings tolerated; blocked on new errors

      - name: Build
        run: npm run build
        env:
          # Build only — no real Supabase call at build time
          NEXT_PUBLIC_SUPABASE_URL: https://demo.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy
          NEXT_PUBLIC_APP_URL: https://triploop.app
          SKIP_ENV_VALIDATION: 'true'
